[project]
name = "doorlock"
version = "2.0.0"
description = "Door Access Control System - Doorlock Service and Management Web Server"
requires-python = ">=3.14"
dependencies = [
    "quart>=0.23.0",
    "hypercorn>=0.18.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
doorlock = "app:main"
mgmt-web = "mgmt_web:main"
generate-esp-secrets = "generate_esp_secrets:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
